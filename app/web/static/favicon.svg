<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner highlight -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="4"/>
  <!-- Robot Antenna -->
  <line x1="256" y1="88" x2="256" y2="136" stroke="#e0e7ff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="76" r="18" fill="#38bdf8"/>
  <circle cx="256" cy="76" r="8" fill="#e0f2fe"/>
  <!-- Robot Ears -->
  <rect x="86" y="216" width="28" height="84" rx="14" fill="#c7d2fe"/>
  <rect x="398" y="216" width="28" height="84" rx="14" fill="#c7d2fe"/>
  <!-- Robot Head -->
  <rect x="114" y="136" width="284" height="240" rx="64" fill="#f8fafc"/>
  <!-- Visor Screen -->
  <rect x="142" y="182" width="228" height="114" rx="34" fill="url(#visor)"/>
  <!-- Glowing Cyan Eyes -->
  <circle cx="204" cy="239" r="22" fill="#22d3ee"/>
  <circle cx="198" cy="232" r="7" fill="#ecfeff"/>
  <circle cx="308" cy="239" r="22" fill="#22d3ee"/>
  <circle cx="302" cy="232" r="7" fill="#ecfeff"/>
  <!-- Smile / Signal Bar -->
  <path d="M214 330 Q256 356 298 330" fill="none" stroke="#6366f1" stroke-width="14" stroke-linecap="round"/>
  <!-- Golden Deal Lightning Bolt Badge (bottom right) -->
  <circle cx="394" cy="390" r="64" fill="#0f172a"/>
  <circle cx="394" cy="390" r="56" fill="url(#bolt)"/>
  <path d="M402 350 L368 394 L394 394 L384 432 L422 384 L395 384 Z" fill="#0f172a"/>
</svg>
